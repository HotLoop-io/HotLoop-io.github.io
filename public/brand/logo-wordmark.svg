<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 277 90" role="img" aria-label="HotLoop">
  <!--
    The word is outlined paths, never a live <text> element. A font-family
    reference renders as a different typeface on every platform and as
    something unpredictable inside a GitHub README.

    The ink flips via a media query INSIDE this file rather than currentColor.
    GitHub renders README images through <img>, and an <img>-loaded SVG does
    not inherit currentColor from the host page, so currentColor renders black
    and the wordmark disappears on GitHub's dark theme. This does work there,
    because the SVG carries its own document context.
  -->
  <style>
    .hl-ink { fill: #1A1A1A; }
    @media (prefers-color-scheme: dark) { .hl-ink { fill: #F5F3EF; } }
  </style>
  <defs>
    <linearGradient id="hlWordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB700"/>
      <stop offset="100%" stop-color="#FF5A00"/>
    </linearGradient>
  </defs>
  <g transform="translate(5,5) scale(1)">
    <circle cx="40" cy="40" r="30.4" fill="none" stroke="url(#hlWordGrad)" stroke-width="9.6"
            stroke-linecap="round" stroke-dasharray="143.3 47.8" transform="rotate(-45 40 40)"/>
    <circle cx="61.6" cy="18.4" r="4.8" fill="#FF5A00"/>
  </g>
