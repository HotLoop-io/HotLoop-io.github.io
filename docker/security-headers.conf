# Sent on every response from the site server. nginx drops a server's add_header lines inside any
# location that sets its own, so docker/nginx.conf includes this file in each place that does.
# The same HSTS value Traefik sends (embernet-iac cluster/traefik), so the image alone passes hstspreload.org.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
