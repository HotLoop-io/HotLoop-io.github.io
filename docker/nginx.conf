# Serves hotloop.io from the mothership.
#
# Traefik terminates TLS and sends two hostnames here (the hotloop entry in embernet-iac sites.tf):
#
#   hotloop.io       the site (the default server below), plus the five Helm chart repositories
#   www.hotloop.io   301 to the same path on hotloop.io
#
# docs.hotloop.io is a separate site on GitHub Pages and never reaches this pod.
#
# $legacy_redirect comes from redirects.conf, which scripts/stage-image.mjs generates from the built pages. It is the
# full URL a path now lives at, or "" for a path with no entry.

# Bot and spam rules for the marketing site (Patrick's allowlist and blocklist, 2026-11-26).
# Everything not named here stays allowed: search engines, AI search and training crawlers and SEO
# tools all get the page. Only clear scraping libraries and two referral spam hosts are refused.
# curl and wget stay allowed, because our uptime checks and proof tools use them. They apply to the
# site's pages only, never to the chart repositories: helm's own user agent is Go-http-client.
map $http_user_agent $bad_bot {
    default 0;
    ~*python-requests       1;
    ~*scrapy                1;
    ~*go-http-client        1;
    ~*headlesschrome        1;
    ~*phantomjs             1;
}
map $http_referer $spam_ref {
    default 0;
    ~*aocr\.org             1;
    ~*scriblihelp\.com      1;
}
# The key is the visitor's address. An empty key is not counted, and the fingerprinted /_astro/ assets get one:
# a cold page load plus the browser's prefetch of the nav makes about 50 requests in under a second, more than the
# burst below, and the files a page needs are never counted against a visitor.
map $uri $perip_key {
    ~^/_astro/  "";
    default     $binary_remote_addr;
}
limit_req_zone $perip_key zone=perip:10m rate=10r/s;

# Traefik reaches the pod from the cluster's pod network and puts the visitor's address in
# X-Forwarded-For (Traefik holds hostPort 443 itself, so it sees the real client). Trust that header
# only from the pod CIDR, so the rate limit counts each visitor and not Traefik.
set_real_ip_from 10.42.0.0/16;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

# Redirects must not carry the pod's name or port 3000 into a Location header.
absolute_redirect off;
port_in_redirect  off;

# The chart repositories: a minute of cache, and stale answers if GitHub hiccups.
proxy_cache_path /tmp/charts levels=1:2 keys_zone=charts:10m max_size=512m inactive=60m use_temp_path=off;

server {
    listen       3000;
    server_name  www.hotloop.io;

    include /etc/nginx/security-headers.conf;

    location / {
        return 301 https://hotloop.io$request_uri;
    }
}

# The site. default_server, so the probes (Host is the pod's address) and an unknown name are
# served the site rather than refused.
server {
    listen       3000 default_server;
    server_name  hotloop.io;
    root         /usr/share/nginx/html;
    index        index.html;

    include /etc/nginx/security-headers.conf;

    # Every Helm chart repository lives on a GitHub Pages project site (the gh-pages branch of a product repository, four of the
    # five private, so there is no raw.githubusercontent.com source without a token), and the URLs inside each index.yaml are
    # https://hotloop.io/<repo>/<chart>.tgz, so these five paths answer here exactly as they did on Pages.
    # The pod's DNS server is written by /docker-entrypoint.d/30-resolver.sh; a name in a variable is looked up
    # again as GitHub's addresses change.
    #
    # Two sources, so there is never a gap whichever way GitHub's custom domain on the org site stands:
    #   1. Host hotloop.io. While hotloop.io is the org site's custom domain, GitHub serves the project sites under it directly,
    #      which is what Pages has always answered here, and that holds after DNS has moved to this server.
    #   2. Host hotloop-io.github.io, when (1) answers 404. Once the custom domain is retired, the project sites are served
    #      there directly. While the custom domain is still set, a real 404 from (1) comes back from here as a 301 to
    #      hotloop.io, and that is turned into the 404 it is, so the path never loops.
    include /tmp/resolver.conf;
    recursive_error_pages on;

    location ~ ^/(hotloop|hotloop-flow|hotloop-cascade|hotloop-codesys|hotloop-transmitter)$ {
        return 301 /$1/;
    }

    location ~ ^/(?<chart_repo>hotloop|hotloop-flow|hotloop-cascade|hotloop-codesys|hotloop-transmitter)/(?<chart_rest>.*)$ {
        set $chart_host hotloop-io.github.io;
        proxy_pass https://$chart_host/$chart_repo/$chart_rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host hotloop.io;
        proxy_ssl_server_name on;
        proxy_ssl_name $chart_host;
        proxy_redirect https://hotloop.io/ /;
        proxy_cache charts;
        proxy_cache_key "custom$request_uri";
        proxy_cache_valid 200 301 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Set-Cookie;
        proxy_intercept_errors on;
        error_page 404 = @charts_project;
        include /etc/nginx/security-headers.conf;
        gzip on;
        gzip_proxied any;
        gzip_types text/yaml application/yaml text/plain;
    }

    location @charts_project {
        set $chart_host hotloop-io.github.io;
        proxy_pass https://$chart_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $chart_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $chart_host;
        proxy_redirect https://$chart_host/ /;
        proxy_cache charts;
        proxy_cache_key "project$request_uri";
        proxy_cache_valid 200 301 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Set-Cookie;
        proxy_intercept_errors on;
        error_page 301 302 = @charts_not_found;
        include /etc/nginx/security-headers.conf;
        gzip on;
        gzip_proxied any;
        gzip_types text/yaml application/yaml text/plain;
    }

    location @charts_not_found {
        return 404;
    }

    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/manifest+json;

    # nginx's mime table lacks or words these differently from GitHub Pages; the same types are served.
    location ~ \.xml$ {
        types { application/xml xml; }
        include /etc/nginx/security-headers.conf;
    }

    location = /favicon.ico {
        types { image/vnd.microsoft.icon ico; }
        include /etc/nginx/security-headers.conf;
    }

    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        include /etc/nginx/security-headers.conf;
    }

    # /healthz carries the release; /readyz is the same check for a static site.
    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /readyz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        try_files /healthz =503;
    }

    # Every page is a directory with an index.html (/es/ is es/index.html). A directory without its slash gets nginx's
    # own 301 to the slash, as it did on Pages. A forwarding address (the old Gateway release notes) leaves in one 301.
    location / {
        if ($bad_bot)  { return 403; }
        if ($spam_ref) { return 403; }
        limit_req zone=perip burst=40 nodelay;
        include /etc/nginx/security-headers.conf;

        if ($legacy_redirect != "") {
            return 301 $legacy_redirect$is_args$args;
        }
        try_files $uri $uri/ =404;
    }

    # The branded page, with the real 404 status.
    error_page 404 /404.html;
    location = /404.html { internal; include /etc/nginx/security-headers.conf; }

    # Astro fingerprints asset filenames with a content hash, so cache forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    gzip       on;
    gzip_vary  on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
}
